[package]
name = "tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local terminal tracker for job applications"

[dependencies]
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled"] }
jiff = "1"
color-eyre = "0.6"
directories = "6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
